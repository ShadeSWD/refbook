# name обязателен (иначе конфликт компоузов на сервере)
name: refbook

services:
  web:
    image: nginx:alpine
    container_name: refbook-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8067:80"
    volumes:
      - ../site:/usr/share/nginx/html:ro
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
  api:
    image: node:20-alpine
    container_name: refbook-api
    restart: unless-stopped
    command: node /srv/server.js
    ports:
      - "127.0.0.1:8072:8080"
    volumes:
      - ../api-server/server.js:/srv/server.js:ro
      - ../site/lib/rmrs.js:/lib/rmrs.js:ro
      - ../site/lib/rmrs-graph.js:/lib/rmrs-graph.js:ro
      - ../site/lib/naca.js:/lib/naca.js:ro
      - ../site/api/tables/terms.json:/data/terms.json:ro
